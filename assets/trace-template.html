<title>__TITLE__</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: control bar on top, lane diagram left (sticky), step detail right; stacks at phone width. */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --surface-2: #eaeef4;
  --fg: #1b2230;
  --muted: #5d6675;
  --line: #d9dfe8;
  --accent: #2456c9;
  --accent-soft: #e3eafb;
  --code-bg: #f7f9fc;
  --code-fg: #1b2230;
  --code-line: #d6e2ff;
  --code-kw: #8a2d9c;
  --code-str: #1a7f4b;
  --code-var: #b3541e;
  --code-cm: #7b8594;
  --code-num: #2456c9;
  --lane-a: #2a9166;
  --lane-b: #c9463a;
  --lane-c: #2456c9;
  --lane-d: #7646c7;
  --lane-e: #b8761a;
  --lane-f: #2a8f9a;
  --warn-bg: #fff4e0;
  --warn-fg: #7a4c00;
  --font-ui: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --font-code: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1319; --surface: #171c24; --surface-2: #1f2631; --fg: #e7ebf1; --muted: #9aa5b5; --line: #2b3441;
    --accent: #86a6ff; --accent-soft: #1d2a4a; --code-bg: #0c1118; --code-fg: #dfe5ee; --code-line: #1e2d52;
    --code-kw: #d58df0; --code-str: #7fd6a3; --code-var: #f0a06a; --code-cm: #7c879a; --code-num: #9bb5ff;
    --lane-a: #4ec98f; --lane-b: #f07a6e; --lane-c: #86a6ff; --lane-d: #b48cf5; --lane-e: #e8a84a; --lane-f: #5fd0dc;
    --warn-bg: #3a2a0c; --warn-fg: #f3cf8a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1319; --surface: #171c24; --surface-2: #1f2631; --fg: #e7ebf1; --muted: #9aa5b5; --line: #2b3441;
  --accent: #86a6ff; --accent-soft: #1d2a4a; --code-bg: #0c1118; --code-fg: #dfe5ee; --code-line: #1e2d52;
  --code-kw: #d58df0; --code-str: #7fd6a3; --code-var: #f0a06a; --code-cm: #7c879a; --code-num: #9bb5ff;
  --lane-a: #4ec98f; --lane-b: #f07a6e; --lane-c: #86a6ff; --lane-d: #b48cf5; --lane-e: #e8a84a; --lane-f: #5fd0dc;
  --warn-bg: #3a2a0c; --warn-fg: #f3cf8a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; margin: 0; }
.wrap { max-width: 1400px; margin: 0 auto; padding-block: 20px 40px; padding-inline: 16px; }
header h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.01em; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 70ch; }
.phases { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.phase-chip { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 0.85rem; cursor: pointer; display: flex; gap: 8px; align-items: center; }
.phase-chip .n { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.phase-chip[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.phase-chip:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.controls button { font: inherit; font-weight: 600; font-size: 0.9rem; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.controls button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.controls button:disabled { opacity: 0.45; cursor: default; }
.controls .pos { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.9rem; min-width: 7ch; }
.controls input[type="range"] { flex: 1 1 160px; min-width: 120px; accent-color: var(--accent); }
.controls .hint { color: var(--muted); font-size: 0.78rem; flex-basis: 100%; }
@media (min-width: 900px) { .controls .hint { flex-basis: auto; margin-left: auto; } }

.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 16px; }
@media (min-width: 1000px) { .grid { grid-template-columns: minmax(0, 54fr) minmax(0, 46fr); align-items: start; } .diagram { position: sticky; top: 76px; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.diagram { padding: 12px; }
.diagram .scroller { overflow-x: auto; }
.diagram svg { display: block; width: 100%; min-width: 720px; height: auto; }
.lane-title { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; fill: var(--muted); }
.lane-bg { fill: var(--surface-2); opacity: 0.55; }
.node rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; transition: stroke 0.25s, fill 0.25s, stroke-width 0.25s; }
.node text { font-family: var(--font-code); font-size: 12px; fill: var(--fg); }
.node .dot { r: 4; }
.node.visited rect { stroke-width: 1.5; }
.node.active rect { stroke-width: 2.5; fill: var(--accent-soft); }
.node.active text { font-weight: 500; }
.node.dim { opacity: 0.55; }
.node.lane-0.visited rect, .node.lane-0.active rect { stroke: var(--lane-a); }
.node.lane-1.visited rect, .node.lane-1.active rect { stroke: var(--lane-b); }
.node.lane-2.visited rect, .node.lane-2.active rect { stroke: var(--lane-c); }
.node.lane-3.visited rect, .node.lane-3.active rect { stroke: var(--lane-d); }
.node.lane-4.visited rect, .node.lane-4.active rect { stroke: var(--lane-e); }
.node.lane-5.visited rect, .node.lane-5.active rect { stroke: var(--lane-f); }
.dot.lane-0 { fill: var(--lane-a); } .dot.lane-1 { fill: var(--lane-b); } .dot.lane-2 { fill: var(--lane-c); } .dot.lane-3 { fill: var(--lane-d); } .dot.lane-4 { fill: var(--lane-e); } .dot.lane-5 { fill: var(--lane-f); }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.2; opacity: 0.28; }
.edge.current { stroke: var(--accent); stroke-width: 2.4; opacity: 1; stroke-dasharray: 6 5; animation: flow 0.9s linear infinite; }
.edge.loopback { stroke-dasharray: 2 4; }
.traveler { fill: var(--accent); }
@keyframes flow { to { stroke-dashoffset: -22; } }
@media (prefers-reduced-motion: reduce) { .edge.current { animation: none; } .traveler { display: none; } .node rect { transition: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 8px 4px 0; font-size: 0.78rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; background: var(--c); }

.detail { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.eyebrow .ph { color: var(--fg); font-weight: 600; }
.loop-tag { background: var(--warn-bg); color: var(--warn-fg); border-radius: 6px; padding: 2px 8px; text-transform: none; letter-spacing: 0; font-weight: 600; }
.detail h2 { margin: 0; font-size: 1.2rem; text-wrap: balance; }
.file { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 0.86rem; align-items: baseline; }
.file dt { color: var(--muted); }
.file dd { margin: 0; font-family: var(--font-code); font-size: 0.82rem; word-break: break-all; }
.file dd.lane { display: flex; align-items: center; gap: 8px; font-family: var(--font-ui); }
.file dd.lane i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); display: inline-block; }
pre.code { margin: 0; background: var(--code-bg); color: var(--code-fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 0; overflow-x: auto; font-family: var(--font-code); font-size: 0.78rem; line-height: 1.55; }
pre.code .ln { display: grid; grid-template-columns: 3.2ch 1fr; gap: 0 12px; padding: 0 12px; white-space: pre; }
pre.code .ln.hit { background: var(--code-line); }
pre.code .ln b { font-weight: 400; color: var(--code-cm); text-align: right; user-select: none; }
.kw { color: var(--code-kw); } .str { color: var(--code-str); } .vr { color: var(--code-var); } .cm { color: var(--code-cm); font-style: italic; } .num { color: var(--code-num); }
.note { margin: 0; font-size: 0.93rem; }
.note strong { font-weight: 600; }
.loads { display: flex; flex-wrap: wrap; gap: 6px; }
.load { font-size: 0.78rem; border-radius: 6px; padding: 3px 9px; background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.load.hot { background: var(--warn-bg); color: var(--warn-fg); border-color: transparent; }
.steps { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
.steps button { text-align: left; font: inherit; font-size: 0.82rem; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 6px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.steps button b { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; min-width: 2.2ch; }
.steps button[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.steps button i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; align-self: center; }
</style>

<div class="wrap">
  <header>
    <h1>__TITLE__</h1>
    <p>__INTRO__</p>
    <div class="phases" id="phases"></div>
  </header>

  <div class="controls" role="group" aria-label="Playback">
    <button id="btn-first" type="button" title="First step">⏮</button>
    <button id="btn-prev" type="button">◀ Back</button>
    <button id="btn-play" type="button" class="primary">▶ Play</button>
    <button id="btn-next" type="button">Forward ▶</button>
    <button id="btn-last" type="button" title="Last step">⏭</button>
    <span class="pos" id="pos"></span>
    <input id="scrub" type="range" min="0" max="0" value="0" aria-label="Step">
    <span class="hint">Keys: ← → step, space play/pause</span>
  </div>

  <div class="grid">
    <section class="panel diagram" aria-label="Request flow diagram">
      <div class="scroller"><svg id="svg" viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lane diagram of files the request passes through"></svg></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="panel detail" id="detail" aria-live="polite"></section>
  </div>

  <nav class="steps" id="steps" aria-label="All steps"></nav>
</div>

<script>
(function () {
  /* __DATA__
     Replace this whole comment with four arrays. Shapes:
     var LANES  = [{ id, label }];                      // 4 to 6 columns, left to right in call direction
     var NODES  = [{ id, lane, label }];                // one per file or external system, label <= 24 chars
     var PHASES = [{ id, n: 'Phase 1', label }];        // one per user-visible stage
     var STEPS  = [{ phase, node, from?, loop?, title, file, method, lang: 'php'|'js'|'ts', code, hit: [lineNumbers], note, loads: ['pill', '!hot pill'] }];
  */
  var LANES = [];
  var NODES = [];
  var PHASES = [];
  var STEPS = [];

  /* ---------- diagram geometry ---------- */
  var W = 1040, LANE_W = 208, NODE_W = 178, NODE_H = 38, GAP = 54, TOP = 64;
  var laneIndex = {}; LANES.forEach(function (l, i) { laneIndex[l.id] = i; });
  var pos = {}; var perLane = {};
  NODES.forEach(function (n) {
    var li = laneIndex[n.lane]; perLane[li] = (perLane[li] || 0);
    n.x = li * LANE_W + (LANE_W - NODE_W) / 2; n.y = TOP + perLane[li] * GAP; perLane[li]++;
    n.cx = n.x + NODE_W / 2; n.cy = n.y + NODE_H / 2; pos[n.id] = n;
  });
  var H = TOP + Math.max.apply(null, Object.keys(perLane).map(function (k) { return perLane[k]; })) * GAP + 10;
  var svg = document.getElementById('svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) { e.setAttribute(k, attrs[k]); } (parent || svg).appendChild(e); return e; }
  LANES.forEach(function (l, i) {
    el('rect', { x: i * LANE_W + 4, y: 8, width: LANE_W - 8, height: H - 16, rx: 10, 'class': 'lane-bg' });
    var t = el('text', { x: i * LANE_W + LANE_W / 2, y: 34, 'text-anchor': 'middle', 'class': 'lane-title' }); t.textContent = l.label;
  });
  var edgeLayer = el('g', { id: 'edges' });
  var nodeEls = {};
  NODES.forEach(function (n) {
    var g = el('g', { 'class': 'node lane-' + laneIndex[n.lane], id: 'node-' + n.id });
    el('rect', { x: n.x, y: n.y, width: NODE_W, height: NODE_H, rx: 8 }, g);
    el('circle', { cx: n.x + 14, cy: n.cy, r: 4, 'class': 'dot lane-' + laneIndex[n.lane] }, g);
    var t = el('text', { x: n.x + 26, y: n.cy + 4 }, g); t.textContent = n.label;
    nodeEls[n.id] = g;
  });
  var traveler = el('circle', { r: 5, 'class': 'traveler', cx: -20, cy: -20 });

  function edgePath(a, b) {
    var sx, sy, ex, ey, c1x, c1y, c2x, c2y;
    if (b.cx > a.cx + 1) { sx = a.x + NODE_W; sy = a.cy; ex = b.x; ey = b.cy; c1x = sx + 40; c1y = sy; c2x = ex - 40; c2y = ey; }
    else if (b.cx < a.cx - 1) { sx = a.x; sy = a.cy; ex = b.x + NODE_W; ey = b.cy; c1x = sx - 40; c1y = sy; c2x = ex + 40; c2y = ey; }
    else {
      var down = b.cy > a.cy; sx = a.x + NODE_W; sy = a.cy; ex = b.x + NODE_W; ey = b.cy; var bul = 38 + Math.abs(b.cy - a.cy) * 0.15;
      c1x = sx + bul; c1y = sy; c2x = ex + bul; c2y = ey; if (!down) { c1y = sy; c2y = ey; }
    }
    return 'M' + sx + ',' + sy + ' C' + c1x + ',' + c1y + ' ' + c2x + ',' + c2y + ' ' + ex + ',' + ey;
  }

  /* ---------- code highlighting ---------- */
  var KW = { php: 'public|private|protected|function|return|foreach|as|if|else|elseif|new|null|true|false|use|class|extends|implements|throw|try|catch|continue|static|array|while|abstract|isset|empty|in_array|unset|for', js: 'const|let|var|function|return|if|else|await|async|then|catch|import|export|from|default|null|true|false|this|new|map' };
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function highlight(code, lang) {
    var re = new RegExp("(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)|('(?:[^'\\\\\\n]|\\\\.)*'|\"(?:[^\"\\\\\\n]|\\\\.)*\"|`(?:[^`\\\\]|\\\\.)*`)|(\\$[A-Za-z_]\\w*)|\\b(" + KW[lang] + ")\\b|(\\b\\d+\\b)", 'g');
    var out = '', last = 0, m;
    while ((m = re.exec(code)) !== null) {
      out += esc(code.slice(last, m.index));
      var cls = m[1] ? 'cm' : m[2] ? 'str' : m[3] ? 'vr' : m[4] ? 'kw' : 'num';
      out += '<span class="' + cls + '">' + esc(m[0]) + '</span>';
      last = re.lastIndex;
    }
    return out + esc(code.slice(last));
  }
  function renderCode(step) {
    var html = highlight(step.code, step.lang);
    var lines = html.split('\n'); var hit = step.hit || [];
    return lines.map(function (l, i) { return '<div class="ln' + (hit.indexOf(i + 1) >= 0 ? ' hit' : '') + '"><b>' + (i + 1) + '</b><span>' + (l || ' ') + '</span></div>'; }).join('');
  }

  /* ---------- rendering ---------- */
  var idx = 0, timer = null;
  var detail = document.getElementById('detail'), pos$ = document.getElementById('pos'), scrub = document.getElementById('scrub');
  var stepsNav = document.getElementById('steps'), phasesEl = document.getElementById('phases');
  scrub.max = STEPS.length - 1;
  var legend = document.getElementById('legend');
  var PALETTE = ['var(--lane-a)', 'var(--lane-b)', 'var(--lane-c)', 'var(--lane-d)', 'var(--lane-e)', 'var(--lane-f)'];
  var laneColor = {}; LANES.forEach(function (l, i) { laneColor[l.id] = PALETTE[i % PALETTE.length]; });
  var laneName = {}; LANES.forEach(function (l) { laneName[l.id] = l.label; var s = document.createElement('span'); s.style.setProperty('--c', laneColor[l.id] || 'var(--muted)'); s.textContent = l.label; legend.appendChild(s); });
  var phaseOf = {}; PHASES.forEach(function (p) { phaseOf[p.id] = p; });

  PHASES.forEach(function (p) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'phase-chip';
    b.innerHTML = '<span class="n">' + p.n + '</span>' + p.label; b.dataset.phase = p.id;
    b.addEventListener('click', function () { go(STEPS.findIndex(function (s) { return s.phase === p.id; })); });
    phasesEl.appendChild(b);
  });
  STEPS.forEach(function (s, i) {
    var b = document.createElement('button'); b.type = 'button'; b.dataset.i = i; var n = pos[s.node];
    b.innerHTML = '<b>' + (i + 1) + '</b><i style="--c:' + laneColor[n.lane] + '"></i><span>' + s.title + '</span>';
    b.addEventListener('click', function () { go(i); });
    stepsNav.appendChild(b);
  });

  function render() {
    var step = STEPS[idx], node = pos[step.node], phase = phaseOf[step.phase];
    pos$.textContent = 'Step ' + (idx + 1) + ' / ' + STEPS.length; scrub.value = idx;
    document.getElementById('btn-prev').disabled = idx === 0; document.getElementById('btn-first').disabled = idx === 0;
    document.getElementById('btn-next').disabled = idx === STEPS.length - 1; document.getElementById('btn-last').disabled = idx === STEPS.length - 1;
    Array.prototype.forEach.call(phasesEl.children, function (c) { c.setAttribute('aria-current', c.dataset.phase === step.phase ? 'true' : 'false'); });
    Array.prototype.forEach.call(stepsNav.children, function (c) { c.setAttribute('aria-current', +c.dataset.i === idx ? 'true' : 'false'); });

    var visited = {}; var phaseStart = STEPS.findIndex(function (s) { return s.phase === step.phase; });
    for (var i = phaseStart; i <= idx; i++) { visited[STEPS[i].node] = true; if (STEPS[i].from) { visited[STEPS[i].from] = true; } }
    NODES.forEach(function (n) { var g = nodeEls[n.id]; g.classList.toggle('active', n.id === step.node); g.classList.toggle('visited', !!visited[n.id] && n.id !== step.node); g.classList.toggle('dim', !visited[n.id] && n.id !== step.node); });

    while (edgeLayer.firstChild) { edgeLayer.removeChild(edgeLayer.firstChild); }
    for (var j = phaseStart; j < idx; j++) { if (STEPS[j].from) { el('path', { d: edgePath(pos[STEPS[j].from], pos[STEPS[j].node]), 'class': 'edge' }, edgeLayer); } }
    if (step.from) {
      var d = edgePath(pos[step.from], node);
      var p = el('path', { d: d, 'class': 'edge current' + (laneIndex[pos[step.from].lane] > laneIndex[node.lane] ? ' loopback' : '') }, edgeLayer);
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        var L = p.getTotalLength(); var t0 = performance.now(); var dur = 900;
        (function tick(now) { if (STEPS[idx] !== step) { return; } var k = Math.min(1, (now - t0) / dur); var pt = p.getPointAtLength(k * L); traveler.setAttribute('cx', pt.x); traveler.setAttribute('cy', pt.y); if (k < 1) { requestAnimationFrame(tick); } })(t0);
      }
    } else { traveler.setAttribute('cx', -20); traveler.setAttribute('cy', -20); }

    detail.innerHTML =
      '<div class="eyebrow"><span class="ph">' + phase.n + ' · ' + phase.label + '</span><span>step ' + (idx + 1) + '</span>' + (step.loop ? '<span class="loop-tag">inside foreach: ' + step.loop + '</span>' : '') + '</div>' +
      '<h2>' + step.title + '</h2>' +
      '<dl class="file"><dt>Layer</dt><dd class="lane"><i style="--c:' + laneColor[node.lane] + '"></i>' + laneName[node.lane] + '</dd><dt>File</dt><dd>' + esc(step.file) + '</dd><dt>Method</dt><dd>' + esc(step.method) + '</dd></dl>' +
      '<pre class="code" tabindex="0">' + renderCode(step) + '</pre>' +
      '<p class="note">' + step.note + '</p>' +
      '<div class="loads">' + (step.loads || []).map(function (l, i) { var hot = l.charAt(0) === '!'; return '<span class="load' + (hot ? ' hot' : '') + '">' + esc(hot ? l.slice(1) : l) + '</span>'; }).join('') + '</div>';
    if (window.innerWidth < 1000) { detail.scrollIntoView({ block: 'nearest' }); }
  }

  function go(i) { idx = Math.max(0, Math.min(STEPS.length - 1, i)); render(); }
  function stop() { if (timer) { clearInterval(timer); timer = null; } document.getElementById('btn-play').textContent = '▶ Play'; }
  function play() { if (idx === STEPS.length - 1) { go(0); } timer = setInterval(function () { if (idx >= STEPS.length - 1) { stop(); return; } go(idx + 1); }, 4000); document.getElementById('btn-play').textContent = '❚❚ Pause'; }
  document.getElementById('btn-next').addEventListener('click', function () { stop(); go(idx + 1); });
  document.getElementById('btn-prev').addEventListener('click', function () { stop(); go(idx - 1); });
  document.getElementById('btn-first').addEventListener('click', function () { stop(); go(0); });
  document.getElementById('btn-last').addEventListener('click', function () { stop(); go(STEPS.length - 1); });
  document.getElementById('btn-play').addEventListener('click', function () { if (timer) { stop(); } else { play(); } });
  scrub.addEventListener('input', function () { stop(); go(+scrub.value); });
  document.addEventListener('keydown', function (e) {
    if (e.target && /input|textarea/i.test(e.target.tagName)) { return; }
    if (e.key === 'ArrowRight') { stop(); go(idx + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { stop(); go(idx - 1); e.preventDefault(); }
    else if (e.key === ' ') { if (timer) { stop(); } else { play(); } e.preventDefault(); }
  });
  var h = (location.hash || '').replace('#', ''); var m = /^step(\d+)$/.exec(h); if (m) { idx = Math.max(0, Math.min(STEPS.length - 1, +m[1] - 1)); }
  render();
})();
</script>
